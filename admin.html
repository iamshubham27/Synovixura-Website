<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Contact Submissions</title>
<link rel="stylesheet" href="style.css">
<style>
.admin-page {
  padding: 40px 20px;
  max-width: 1200px;
  margin: 0 auto;
}
.admin-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 10px;
}
.admin-table {
  width: 100%;
  border-collapse: collapse;
  background: var(--color-paper);
  border-radius: var(--radius-md);
  overflow: hidden;
}
.admin-table th {
  background: var(--color-ink);
  color: var(--color-text-inverse);
  padding: 12px 16px;
  text-align: left;
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}
.admin-table td {
  padding: 12px 16px;
  border-bottom: 1px solid var(--color-border);
}
.admin-table tr:hover {
  background: var(--color-paper-alt);
}
.status-badge {
  display: inline-block;
  padding: 3px 10px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 600;
}
.status-new { background: #e8a33d20; color: #c98a2d; }
.status-read { background: #3e6ae120; color: #2f52b5; }
.status-replied { background: #3ecf8e20; color: #2b9d6c; }
.status-archived { background: #8a8f9b20; color: #5b5f6b; }
.loading { text-align: center; padding: 40px; }
.error { color: var(--color-red); text-align: center; padding: 40px; }
.refresh-btn {
  padding: 8px 16px;
  background: var(--color-amber);
  border: none;
  border-radius: var(--radius-sm);
  cursor: pointer;
  font-weight: 600;
}
.count-badge {
  background: var(--color-amber);
  color: var(--color-ink);
  padding: 4px 12px;
  border-radius: 20px;
  font-weight: 600;
}
.back-link {
  display: inline-block;
  margin-bottom: 15px;
  color: var(--color-text-muted);
  text-decoration: none;
  font-size: 14px;
}
.back-link:hover {
  color: var(--color-blue);
}
[data-theme="dark"] .back-link {
  color: var(--color-text-inverse-muted);
}
[data-theme="dark"] .back-link:hover {
  color: var(--color-amber);
}
</style>
</head>
<body class="dash-body">
<div class="admin-page">
  <a href="index.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Back to site</a>
  
  <div class="admin-header">
    <h1>📬 Contact Submissions</h1>
    <div>
      <span class="count-badge" id="countBadge">0</span>
      <button class="refresh-btn" onclick="loadSubmissions()">🔄 Refresh</button>
    </div>
  </div>
  
  <div id="submissions">
    <div class="loading">Loading submissions...</div>
  </div>
</div>

<script>
async function loadSubmissions() {
  const container = document.getElementById('submissions');
  const countBadge = document.getElementById('countBadge');
  
  container.innerHTML = '<div class="loading">⏳ Loading submissions...</div>';
  
  try {
    // ===== SECURE: Using relative URL (works on localhost AND production) =====
    const response = await fetch('/api/contacts');
    
    // Check if response is OK
    if (!response.ok) {
      throw new Error(`HTTP error! status: ${response.status}`);
    }
    
    const data = await response.json();
    
    // Update count badge
    if (data.success && data.data) {
      countBadge.textContent = data.data.length;
    }
    
    if (data.success && data.data && data.data.length > 0) {
      let html = `
        <table class="admin-table">
          <thead>
            <tr>
              <th>#</th>
              <th>Name</th>
              <th>Email</th>
              <th>Company</th>
              <th>Service</th>
              <th>Budget</th>
              <th>Status</th>
              <th>Date</th>
            </tr>
          </thead>
          <tbody>
      `;
      
      data.data.forEach((contact, index) => {
        const statusClass = {
          'new': 'status-new',
          'read': 'status-read',
          'replied': 'status-replied',
          'archived': 'status-archived'
        }[contact.status] || 'status-new';
        
        // Fix: Use created_at (Supabase uses snake_case) or createdAt (MongoDB)
        const dateField = contact.created_at || contact.createdAt;
        const dateString = dateField ? new Date(dateField).toLocaleDateString() : 'N/A';
        
        html += `
          <tr>
            <td>${index + 1}</td>
            <td><strong>${contact.name || 'N/A'}</strong></td>
            <td><a href="mailto:${contact.email || ''}">${contact.email || 'N/A'}</a></td>
            <td>${contact.company || '-'}</td>
            <td>${contact.service || 'N/A'}</td>
            <td>${contact.budget || '-'}</td>
            <td><span class="status-badge ${statusClass}">${contact.status || 'new'}</span></td>
            <td>${dateString}</td>
          </tr>
        `;
      });
      
      html += '</tbody></table>';
      container.innerHTML = html;
    } else {
      container.innerHTML = `
        <div class="error">
          <span style="font-size: 48px; display: block; margin-bottom: 10px;">📭</span>
          No submissions found yet.<br>
          <span style="font-size: 14px; color: var(--color-text-muted);">Submit a contact form to see data here.</span>
        </div>
      `;
    }
  } catch (error) {
    console.error('❌ Error loading submissions:', error);
    container.innerHTML = `
      <div class="error">
        ❌ Error loading submissions: ${error.message}
        <br><br>
        <span style="font-size: 14px; color: var(--color-text-muted);">
          Make sure the server is running and the API is accessible.
        </span>
      </div>
    `;
  }
}

// Load submissions when page loads
document.addEventListener('DOMContentLoaded', function() {
  // Theme toggle
  var currentTheme = localStorage.getItem('theme') || 'light';
  if (currentTheme === 'dark') {
    document.documentElement.setAttribute('data-theme', 'dark');
  }
  
  // Load submissions
  loadSubmissions();
});

// Refresh button also loads submissions
</script>
</body>
</html>
