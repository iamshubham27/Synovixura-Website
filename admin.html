<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Contact Submissions</title>
<link rel="stylesheet" href="style.css">
<style>
.admin-page {
  padding: 40px 20px;
  max-width: 1200px;
  margin: 0 auto;
}
.admin-table {
  width: 100%;
  border-collapse: collapse;
  background: var(--color-paper);
  border-radius: var(--radius-md);
  overflow: hidden;
}
.admin-table th {
  background: var(--color-ink);
  color: var(--color-text-inverse);
  padding: 12px 16px;
  text-align: left;
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}
.admin-table td {
  padding: 12px 16px;
  border-bottom: 1px solid var(--color-border);
}
.admin-table tr:hover {
  background: var(--color-paper-alt);
}
.status-badge {
  display: inline-block;
  padding: 3px 10px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 600;
}
.status-new { background: #e8a33d20; color: #c98a2d; }
.status-read { background: #3e6ae120; color: #2f52b5; }
.status-replied { background: #3ecf8e20; color: #2b9d6c; }
.status-archived { background: #8a8f9b20; color: #5b5f6b; }
.loading { text-align: center; padding: 40px; }
.error { color: var(--color-red); text-align: center; padding: 40px; }
.refresh-btn {
  padding: 8px 16px;
  background: var(--color-amber);
  border: none;
  border-radius: var(--radius-sm);
  cursor: pointer;
  font-weight: 600;
  margin-bottom: 20px;
}
</style>
</head>
<body class="dash-body">
<div class="admin-page">
  <h1>📬 Contact Submissions</h1>
  <button class="refresh-btn" onclick="loadSubmissions()">🔄 Refresh</button>
  <div id="submissions">
    <div class="loading">Loading submissions...</div>
  </div>
</div>
<script>
async function loadSubmissions() {
  const container = document.getElementById('submissions');
  container.innerHTML = '<div class="loading">Loading submissions...</div>';
  
  try {
    //production URL
    const response = await fetch('https://synovixura-backend.onrender.com/api/contacts');
    const data = await response.json();
    
    if (data.success && data.data.length > 0) {
      let html = `
        <table class="admin-table">
          <thead>
            <tr>
              <th>#</th>
              <th>Name</th>
              <th>Email</th>
              <th>Service</th>
              <th>Budget</th>
              <th>Status</th>
              <th>Date</th>
            </tr>
          </thead>
          <tbody>
      `;
      
      data.data.forEach((contact, index) => {
        const statusClass = {
          'new': 'status-new',
          'read': 'status-read',
          'replied': 'status-replied',
          'archived': 'status-archived'
        }[contact.status] || 'status-new';
        
        html += `
          <tr>
            <td>${index + 1}</td>
            <td><strong>${contact.name}</strong></td>
            <td><a href="mailto:${contact.email}">${contact.email}</a></td>
            <td>${contact.service}</td>
            <td>${contact.budget || '-'}</td>
            <td><span class="status-badge ${statusClass}">${contact.status}</span></td>
            <td>${new Date(contact.createdAt).toLocaleDateString()}</td>
          </tr>
        `;
      });
      
      html += '</tbody></table>';
      container.innerHTML = html;
    } else {
      container.innerHTML = '<div class="error">No submissions found.</div>';
    }
  } catch (error) {
    container.innerHTML = `<div class="error">❌ Error loading submissions: ${error.message}<br><br>Make sure the server is running on http://localhost:5000</div>`;
  }
}

loadSubmissions();
</script>
</body>
</html>
